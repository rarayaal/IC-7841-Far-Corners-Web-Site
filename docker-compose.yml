version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: farcorners_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: farcorners
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farcorners_api
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/farcorners
      JWT_SECRET: dev_super_secret_jwt_key_far_corners
      JWT_EXPIRATION_HOURS: 8

volumes:
  postgres_data: